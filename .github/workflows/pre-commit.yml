name: pre-commit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
      with:
        python-version: 3.x
    # The local hooks call make, which calls Emacs.  Emacs 31.1, the
    # release the checks are written against, not whichever one the
    # runner image ships and not the older release this job used to
    # name: checkdoc up to 30.2 reports a doc string line over 80
    # columns and 31.1 no longer looks for one, so the two disagreed
    # about files that pass here and a check that disagrees with the
    # checks beside it is worth nothing.
    - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5   # v8.0
      with:
        version: '31.1'
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd   # v3.0.1

  # melpazoid ships no PyPI package, so its own repository is cloned.
  # It builds a container of its own; the runner's Docker does that.
  #
  # Two packages live in this repository, and melpazoid reads one
  # package: without `:files' it took every .el file for part of overblock-pycell
  # and failed over the prefixes and the second Version header.  So it
  # runs once for each package, and `:files' names that package's whole
  # file list.  Those lists are the ones in the Makefile.
  melpazoid:
    runs-on: ubuntu-latest
    # The notebook's own recipe cannot pass yet, and says so plainly:
    # `Package overblock is not installable'.  It declares the layer as
    # a dependency, the layer has no repository of its own and is on no
    # archive, and melpazoid installs a package's dependencies before it
    # reads it.  The failure is a true statement about the world rather
    # than a fault in the package, so it is allowed to stand in the log
    # and not to redden the run.  Take this line out once overblock is
    # published — the layer's own recipe passes today and this is the
    # one thing waiting on the split.
    continue-on-error: ${{ startsWith(matrix.recipe, '(overblock-pycell') }}
    strategy:
      fail-fast: false
      matrix:
        # melpazoid asks GitHub about the repository the recipe names,
        # so it must be one that exists: overblock has no repository of
        # its own yet, and both recipes therefore name this one.  The
        # strings are unquoted because the YAML formatter writes a plain
        # scalar, and a quoted one fails that hook.
        recipe:
        - (overblock-pycell :fetcher github :repo "MArpogaus/overblock-pycell" :files ("overblock-pycell.el"))
        - (overblock :fetcher github :repo "MArpogaus/overblock-pycell" :files ("overblock.el" "overblock-md.el" "overblock-repl.el" "overblock-md-preview.el" "overblock-pydoc.el"))
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - run: |
        sudo apt-get install emacs && emacs --version
        git clone --depth 1 https://github.com/riscy/melpazoid.git ~/melpazoid
    - env:
        LOCAL_REPO: ${{ github.workspace }}
        RECIPE: ${{ matrix.recipe }}
        EXIST_OK: true
      run: make -C ~/melpazoid
