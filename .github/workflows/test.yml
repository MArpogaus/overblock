name: test

on:
  push:
    branches: [main, dev, overblock]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs-version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.1', '30.1', '30.2', '31.1', snapshot]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5   # v8.0
      with:
        version: ${{ matrix.emacs-version }}
    # A fifth of the suite renders markdown and skips itself where no
    # converter is installed: 27 tests, without saying so.  STRICT=1
    # below turns that silence into a failure.
    - name: Install a markdown converter
      run: sudo apt-get update -qq && sudo apt-get install -yqq pandoc
    - name: Show version
      run: emacs --version
    - name: Byte-compile, checkdoc, package-lint, relint and test
      run: make STRICT=1

  # The scrolling tests measure pixels, so they need an Emacs with X
  # support in a virtual display.  The nix builds the matrix uses have
  # no X, which is why this is its own job on the distribution Emacs.
  # The image is pinned: `ubuntu-latest' moves to the next LTS on its own
  # and takes that Emacs with it, and this is the one job whose answers
  # are pixels.
  scroll:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: Install Emacs, a display, a converter, IPython and R
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yqq xvfb emacs-gtk pandoc r-base-core
        pipx install ipython
    - name: Show version
      run: emacs --version
    # Everything, not only the pixels: this is the one Emacs in CI with
    # image support, so it is the only row where the tests that need a
    # PNG run rather than skip.  It is also the only one with the
    # interpreters, and `test-live' is the pair of suites that start a
    # process — one an IPython and one an R, and five faults between them
    # once lived past every batch check for want of them.  STRICT=1
    # makes a skipped suite a failure, which is why both are installed
    # above.
    - name: The whole suite, the scrolling tests, then the live ones
      run: make STRICT=1 all scroll test-live
