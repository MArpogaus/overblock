name: test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.emacs-version == 'snapshot' }}
    strategy:
      fail-fast: false
      matrix:
        emacs-version: ['29.1', '30.1', '30.2', '31.1', snapshot]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - uses: purcell/setup-emacs@bdc64dc730ae1fcba200bfd52cb1b4cf6159cbe5   # v8.0
      with:
        version: ${{ matrix.emacs-version }}
    - name: Show version
      run: emacs --version
    - name: Byte-compile, checkdoc, package-lint and test
      run: make

  # The scrolling tests measure pixels, so they need an Emacs with X
  # support in a virtual display.  The nix builds the matrix uses have
  # no X, which is why this is its own job on the distribution Emacs.
  scroll:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
    - name: Install Emacs, a virtual display and a markdown converter
      run: |
        sudo apt-get update -qq
        sudo apt-get install -yqq xvfb emacs-gtk pandoc
    - name: Show version
      run: emacs --version
    - name: Scrolling tests
      run: make scroll
